name: Trooly (Airbnb)
description: >-
  Trooly, Inc. was a machine-learning trust and safety startup that scored the
  trustworthiness of individuals using publicly available data and digital
  footprints, offering its Instant Trust screening service to businesses for
  trust and safety management, risk assessment, and customer relationship use
  cases. Backed by Bain Capital Ventures, Trooly was acquired by Airbnb and
  ceased operations on June 19, 2017, shutting down its external APIs; its
  technology was absorbed into Airbnb's trust and safety systems and Trooly,
  Inc. remains an Airbnb subsidiary. trooly.com is now a parked domain and no
  living API surface exists.
